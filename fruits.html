<html>
<head>
<title>Check Array Value</title>
</head>
<body>
<h2>Check Array Value</h2>
<script>
    let fruits = ["Apple","Banana","Mango","Orange"]
    let value = prompt("Enter a fruit:");
if(fruits.indexOf(value)!==-1)
{
alert(value + " is present in the array.");
}
else
{
alert(value + " is not present in the array.");
}
</script>
</body>
</html>
