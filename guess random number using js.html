<!DOCTYPE html>
<html>
<head>
<title>Guess the Number</title>
</head>
<body>
<h2>Guess the Number(1 to 10)</h2>
<script>
let randomNumber=Math.floor(Math.random()*1)+1;
let guess=prompt("Enter your Guess(1 to 10):");
if(guess==randomNumber){
alert("Congratulations! You guessed it right.");
}else{
alert("Wrong guess!the correct number is"+randomNumber);
}
</script>
</body>
</html>
