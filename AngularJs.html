<!DOCTYPE html>
<html ng-app="myApp">
<head>
<title>AngularJs Directive Example</title>
<!--AngularJs Library-->
<Script
src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js">
</Script>
</head>
<body>
<h2>Angular Js custom Directive Example.</h2>
<!--Custom directive-->
<student-info></student-info>
<Script>
var app=angular.module("myApp",[]);
app.directive("studentInfo",function(){
return{
restrict:"E",
template:
"<div>"+
"<h3>Student Information</h3>"+
"<p>Name:Anish</p>"+
"<p>Course:B.Sc Computer science</p>"+
"<p>Department:Computer science</p>"+
"</div>"
};
});  
</Script>
</body>
</html>
