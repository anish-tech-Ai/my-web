<html>
<head>
<title>Angular Js Filters</title>
<script
src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js">
</script>
</head>
<body ng-app>
<h1>Uppercase filters</h1>
Enter Name:
<input type="text"ng-model="name">
<p>Orginal:{{name}}</p>
<p>Uppercase:{{name|uppercase}}</p>
</body>
</html>
